name: Buat kunci tanda tangan (sekali saja)

# Jalankan manual SEKALI dari tab Actions, lalu simpan hasilnya sebagai Secrets.
# Kunci ini membuat APK baru bisa menimpa APK lama tanpa uninstall.
#
# PERHATIAN: di repo PUBLIK, file artifact bisa diunduh siapa saja.
# Unduh hasilnya, simpan sebagai Secret, lalu HAPUS artifact-nya di halaman run ini.

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Kata sandi keystore (minimal 8 karakter, catat baik-baik)'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Buat keystore
        env:
          P: ${{ inputs.password }}
        run: |
          keytool -genkeypair -v -keystore sign.jks -alias wedding \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$P" -keypass "$P" \
            -dname "CN=Erik dan Oni, OU=Wedding, O=Wedding, L=-, S=-, C=ID"
          base64 -w0 sign.jks > keystore-base64.txt
          wc -c keystore-base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-rahasia
          path: keystore-base64.txt
          retention-days: 1

      - name: Langkah selanjutnya
        run: |
          {
            echo "## Kunci dibuat ✅"
            echo ""
            echo "1. Unduh artifact **keystore-rahasia** di halaman ini dan buka \`keystore-base64.txt\`."
            echo "2. Settings → Secrets and variables → Actions → New repository secret:"
            echo "   - \`ANDROID_KEYSTORE_B64\` = seluruh isi file itu"
            echo "   - \`ANDROID_KEYSTORE_PASSWORD\` = kata sandi yang tadi diketik"
            echo "3. Kembali ke halaman run ini dan **hapus artifact-nya** (ikon tong sampah)."
            echo ""
            echo "Simpan kata sandinya. Tanpa kunci ini, APK berikutnya tidak bisa menimpa APK lama."
          } >> $GITHUB_STEP_SUMMARY
